<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPortal WebGIS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="geoportal-header">
        <div class="header-content">
            <h1>GeoPortal WebGIS</h1>
            <p>Sistema Interativo de Informações Geográficas</p>
        </div>
    </header>

    <main>
        <!-- Sidebar Toggle Button (Absolute over map) -->
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Abrir Camadas">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <!-- Sidebar Panel -->
        <aside id="sidebar" class="sidebar open">
            <div class="sidebar-header">
                <h2>Camadas de Dados</h2>
                <button id="sidebar-close" class="sidebar-close" aria-label="Fechar Aba">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="sidebar-content">
                <!-- Layer Item: IRU -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-box" style="background-color: rgba(52, 211, 153, 0.4); border: 2px solid #10b981;"></div>
                        <span class="layer-name">IRU_URA_2025</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-iru" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <!-- Layer Item: Uberaba -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-box" style="background-color: rgba(96, 165, 250, 0.4); border: 2px solid #3b82f6;"></div>
                        <span class="layer-name">Uberaba_2025</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-uberaba" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <!-- Layer Item: Drone -->
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-color-box" style="background-image: url('data:image/svg+xml;utf8,<svg width=\'20\' height=\'20\' xmlns=\'http://www.w3.org/2000/svg\'><rect width=\'20\' height=\'20\' fill=\'%23e2e8f0\'/><path d=\'M2 2l16 16M18 2L2 18\' stroke=\'%2394a3b8\' stroke-width=\'2\'/></svg>'); border: 2px solid #64748b;"></div>
                        <span class="layer-name">Ortofoto Drone</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-drone">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </aside>

        <!-- Loading Screen -->
        <div id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Carregando dados geográficos...</div>
        </div>
        
        <!-- Map Container -->
        <div id="map"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom JS -->
    <script src="main.js"></script>
</body>
</html>
